<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบเงินเดือนพนักงานรายวัน — Thai Daily Payroll</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;background:#f1f5f9;color:#1e293b;padding-bottom:60px}
header{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;padding:24px 16px;text-align:center}
header h1{font-size:1.5rem}header p{opacity:.85;font-size:.9rem;margin-top:4px}
nav{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:14px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.08);position:sticky;top:0;z-index:10}
.tabbtn{border:none;background:#e2e8f0;color:#334155;padding:9px 16px;border-radius:20px;cursor:pointer;font-family:inherit;font-size:.9rem;font-weight:500}
.tabbtn.active{background:#2563eb;color:#fff}
main{max-width:1000px;margin:20px auto;padding:0 12px}
.card{background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.07);padding:20px;margin-bottom:18px}
.card h2{font-size:1.15rem;color:#1e3a8a;margin-bottom:14px;border-left:4px solid #2563eb;padding-left:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
label{font-size:.85rem;color:#475569;display:block;margin-bottom:4px}
input,select{width:100%;padding:9px 10px;border:1px solid #cbd5e1;border-radius:8px;font-family:inherit;font-size:.95rem;background:#fff}
input:focus,select:focus{outline:2px solid #93c5fd;border-color:#2563eb}
.btn{border:none;border-radius:8px;padding:10px 18px;cursor:pointer;font-family:inherit;font-size:.95rem;font-weight:500;margin:4px 4px 0 0}
.btn-primary{background:#2563eb;color:#fff}.btn-primary:hover{background:#1d4ed8}
.btn-green{background:#16a34a;color:#fff}.btn-green:hover{background:#15803d}
.btn-red{background:#dc2626;color:#fff;padding:6px 10px;font-size:.8rem}
.btn-gray{background:#64748b;color:#fff;padding:6px 10px;font-size:.8rem}
.btn-yellow{background:#f59e0b;color:#fff}
table{width:100%;border-collapse:collapse;font-size:.88rem;margin-top:10px}
th,td{border:1px solid #e2e8f0;padding:7px 8px;text-align:left}
th{background:#1e3a8a;color:#fff;font-weight:500}
tr:nth-child(even){background:#f8fafc}
.r{text-align:right}
.result{background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:14px;margin-top:14px}
.result .net{font-size:1.3rem;font-weight:700;color:#16a34a}
.note{background:#fef9c3;border:1px solid #fde047;border-radius:8px;padding:10px;font-size:.85rem;margin-top:10px}
.tbl-wrap{overflow-x:auto}
/* ---------- สลิป ---------- */
.slip{max-width:760px;margin:0 auto;background:#fff;border:1px solid #cbd5e1;padding:26px;font-size:.9rem}
.slip .co{text-align:center;border-bottom:2px solid #1e3a8a;padding-bottom:10px;margin-bottom:12px}
.slip .co h3{color:#1e3a8a;font-size:1.2rem}
.slip h4{text-align:center;color:#1e3a8a;margin:8px 0}
.slip table{margin:8px 0}
.slip .netbox{background:#dcfce7;border:1px solid #86efac;text-align:center;font-size:1.15rem;font-weight:700;color:#15803a;padding:10px;border-radius:8px;margin:12px 0}
.slip .sig{display:flex;justify-content:space-around;margin-top:46px}
.slip .sig div{text-align:center}
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{position:absolute;left:0;top:0;width:100%}
  .slip{border:none}
}
</style>
</head>
<body>
<header>
  <h1>🧾 ระบบเงินเดือนพนักงานรายวัน</h1>
  <p>Thai Daily Payroll — คำนวณตาม
